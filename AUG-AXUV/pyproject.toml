[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aug-axuv"
version = "0.1.0"
description = "Synthetic diagnostic and measurement analysis for the ASDEX Upgrade AXUV diode arrays"
readme = "readme.md"
authors = [{ name = "Ferenc Lengyel", email = "dev@lengyelf.eu" }]
license = "MIT"
# Cherab 1.6 and Raysect 0.9.1 ship wheels for cp39 to cp314.
requires-python = ">=3.14"

# Runtime dependencies shared by both shipped packages (axuv + axuv_measurement).
dependencies = [
    "raysect==0.9.1.*",
    "cherab>=1.6,<1.7",
    "numpy>=2,<2.5",  # aug_sfutils 0.9.3 uses np.chararray, removed in NumPy 2.5
    "scipy",
    "pandas",
    "h5py",
    "matplotlib",
    "shapely",
    "scikit-image",   # axuv_measurement.processing ridge filter
    "pillow",         # publications GIF/figure generation
    # Data access; pinned to a development commit until the first release (plasmasds_utility#30)
    "plasmasds-utility @ git+https://github.com/plasma-sds/plasmasds_utility@8b4fc2c518a60070da2158754a6a08e0fcb66036",
]

[project.optional-dependencies]
# Experimental analysis stack; reading shotfiles needs AUG shotfile server access.
# aug_sfutils is no longer on the PyPI index; the 0.9.3 wheel is still served at its file URL.
measurement = [
    "aug_sfutils @ https://files.pythonhosted.org/packages/e4/a8/b7eb8eaa37d7696372714cc390fcb8ac97bd7a411c26d3e6e02a12707e60/aug_sfutils-0.9.3-py3-none-any.whl",
]

[tool.setuptools.packages.find]
# Auto-discovers axuv/ and axuv_measurement/ from repo root
where = ["."]
include = ["axuv*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests that talk to the plasma-sds data server are opt-in
addopts = ["-m", "not server and not server_write"]
markers = [
    "server: downloads from the data server; run with -m server (private keys need SSH access)",
    "server_write: uploads test files to the public tree of the data server; run with -m server_write",
]
