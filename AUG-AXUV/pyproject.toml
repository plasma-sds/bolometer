[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aug-axuv"
version = "0.1.0"
description = "Synthetic diagnostic and measurement analysis for the ASDEX Upgrade AXUV diode arrays"
readme = "readme.md"
authors = [{ name = "Ferenc Lengyel", email = "dev@lengyelf.eu" }]
license = "MIT"
# cherab 1.5 pins raysect 0.8.1 and numpy<2, which ship wheels only up to cp312.
requires-python = ">=3.12,<3.13"

# Runtime dependencies shared by both shipped packages (axuv + axuv_measurement).
dependencies = [
    "raysect==0.8.1.*",
    "cherab>=1.5,<1.6",
    "numpy<2",
    "scipy",
    "pandas",
    "h5py",
    "matplotlib",
    "shapely",
    "scikit-image",   # axuv_measurement.processing ridge filter
    "pillow",         # publications GIF/figure generation
    # Data access; pinned to a development commit until the first release (plasmasds_utility#30)
    "plasmasds-utility @ git+https://github.com/plasma-sds/plasmasds_utility@3c03ffcc7432e9ca2f0ffea38a3cef61c8d627bc",
]

[project.optional-dependencies]
# Experimental analysis stack; reading shotfiles needs AUG shotfile server access
measurement = [
    "aug_sfutils",
]

[tool.setuptools.packages.find]
# Auto-discovers axuv/ and axuv_measurement/ from repo root
where = ["."]
include = ["axuv*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
